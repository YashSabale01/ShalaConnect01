apiVersion: apps/v1
kind: Deployment
metadata:
  name: shalaconnect
  labels:
    app: shalaconnect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shalaconnect
  template:
    metadata:
      labels:
        app: shalaconnect
    spec:
      containers:
        - name: shalaconnect
          image: shalaconnect:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
